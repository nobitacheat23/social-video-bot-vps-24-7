<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>TikTok Card</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 30px;
      background: transparent;
      display: inline-block;
      width: 920px;
    }
    .tiktok-card {
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(25px);
    }
  </style>
</head>
<body>
  <div id="card" class="tiktok-card w-full rounded-[28px] p-8 transition-all {{ 'bg-[#121212]/95 text-white border border-[#2b2b2b]' if dark_mode else 'bg-white/95 text-gray-900 border border-gray-200' }}">
    <div class="flex items-start justify-between space-x-4">
      <!-- Left: Avatar -->
      <div class="flex-shrink-0 relative">
        <img src="{{ avatar_url or 'https://api.dicebear.com/7.x/bottts/svg?seed=' + username }}" 
             alt="avatar" 
             class="w-14 h-14 rounded-full object-cover ring-2 ring-[#fe2c55]/80 shadow-lg">
        <div class="absolute -bottom-1 -right-1 bg-[#fe2c55] text-white p-1 rounded-full shadow">
          <svg class="w-3 h-3 fill-current" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        </div>
      </div>

      <!-- Center: Comment Body -->
      <div class="flex-1 min-w-0 pr-4">
        <div class="flex items-center space-x-2">
          <span class="font-bold text-[20px] {{ 'text-gray-200' if dark_mode else 'text-gray-900' }}">{{ username }}</span>
          {% if is_op %}
          <span class="bg-[#fe2c55]/15 text-[#fe2c55] text-[12px] font-extrabold px-2 py-0.5 rounded-md">Tác giả</span>
          {% endif %}
        </div>
        
        <p class="mt-2 text-[26px] leading-[1.48] font-normal break-words {{ 'text-white' if dark_mode else 'text-gray-900' }}">{{ content }}</p>

        <!-- Meta footer -->
        <div class="mt-4 flex items-center space-x-5 text-[15px] {{ 'text-gray-400' if dark_mode else 'text-gray-500' }}">
          <span>{{ time_ago or '1 ngày trước' }}</span>
          <span class="font-semibold cursor-pointer hover:underline text-gray-300">Trả lời</span>
          {% if replies and replies > 0 %}
          <span class="text-[#fe2c55] font-medium">Xem {{ replies }} câu trả lời</span>
          {% endif %}
        </div>
      </div>

      <!-- Right: Floating Like Column -->
      <div class="flex flex-col items-center justify-center pl-2 pt-1 flex-shrink-0">
        <div class="w-10 h-10 rounded-full flex items-center justify-center bg-white/5 hover:bg-white/10 transition">
          <svg class="w-7 h-7 text-[#fe2c55] fill-current" viewBox="0 0 24 24">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
          </svg>
        </div>
        <span class="mt-1 text-[15px] font-bold {{ 'text-gray-300' if dark_mode else 'text-gray-700' }}">{{ likes or '24.5K' }}</span>
      </div>
    </div>
  </div>
</body>
</html>
