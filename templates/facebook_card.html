<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Facebook Card</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: transparent;
      padding: 18px;
      display: inline-block;
      width: 920px;
      -webkit-font-smoothing: antialiased;
    }
    .fb-row { display: flex; align-items: flex-start; gap: 14px; width: 100%; }
    .avatar-img { width: 54px; height: 54px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
    .bubble-wrap { flex: 1; min-width: 0; }
    .fb-bubble {
      position: relative;
      display: inline-block;
      max-width: 100%;
      border-radius: 22px;
      padding: 16px 22px;
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.38);
    }
    .theme-light .fb-bubble { background: #f0f2f5; color: #050505; border: 1px solid #e4e6eb; }
    .theme-dark .fb-bubble { background: #242526; color: #e4e6eb; border: 1px solid #3a3b3c; }
    .username { font-weight: 700; font-size: 20px; }
    .text { margin-top: 4px; font-size: 23px; line-height: 1.44; white-space: pre-wrap; word-break: break-word; }
    .react-pill {
      position: absolute;
      bottom: -12px;
      right: 16px;
      background: #ffffff;
      color: #374151;
      border: 1px solid #e5e7eb;
      box-shadow: 0 3px 10px rgba(0,0,0,0.18);
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .theme-dark .react-pill { background: #3a3b3c; color: #e4e6eb; border-color: #4b5563; }
    .actions { margin-top: 12px; padding-left: 14px; display: flex; gap: 18px; font-size: 15px; font-weight: 700; color: #9ca3af; }
  </style>
</head>
<body>
  {% set fallback_svg = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 80'><rect width='80' height='80' fill='%23d1d5db'/><circle cx='40' cy='30' r='14' fill='%236b7280'/><path d='M16 70c4-14 16-22 24-22s20 8 24 22' fill='%236b7280'/></svg>" %}
  <div id="card" class="fb-row {{ 'theme-dark' if dark_mode else 'theme-light' }}">
    <img src="{{ avatar_url or fallback_svg }}" onerror="this.onerror=null;this.src=&quot;{{ fallback_svg }}&quot;;" class="avatar-img" alt="avatar">
    <div class="bubble-wrap">
      <div class="fb-bubble">
        <div class="username">{{ username }}</div>
        <p class="text">{{ content }}</p>
        <div class="react-pill">👍 ❤️ <span>{{ likes or '412' }}</span></div>
      </div>
      <div class="actions">
        <span>Thích</span>
        <span>Phản hồi</span>
      </div>
    </div>
  </div>
</body>
</html>
